<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The RJ Edit</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="contact.css" />
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body>
    <div class="header">
      <div class="container">
        <div class="header-left">
          <img
            class="header-logo"
            src="images/logo round.png"
            alt="The rj edit"
          />
        </div>
        <div class="header-right">
          <a href="index.html">Top</a>
          <a href="menu.html">Menu</a>
          <a href="access.html">Access</a>
          <a href="contact.html">Contact</a>
        </div>
        <div class="clear"></div>
      </div>
    </div>

    <div class="contact">
      <div class="container">
        <h2 class="contact-title">Contact Us</h2>
        <form class="contact-form">
          <h3>Name</h3>
          <input type="text" required />
          <h3>Email</h3>
          <input type="email" required />
          <h3>Types</h3>
          <select>
            <option>About our store</option>
            <option>About our service</option>
            <option>Other</option>
          </select>
          <h3>Content</h3>
          <textarea rows="4"></textarea>
          <br />
          <input type="submit" class="submit-button" />
        </form>
      </div>
    </div>

    <div class="footer">
      <div class="container">
        <div class="footer-left">
          <p>Share this Site</p>
          <a
            href="https://twitter.com/share?ref_src=twsrc%5Etfw"
            class="twitter-share-button"
            data-text="Marine Cafe"
            data-show-count="false"
            >Tweet</a
          >
          <script
            async
            src="https://platform.twitter.com/widgets.js"
            charset="utf-8"
          ></script>
        </div>
        <br />
        <br />
        <br />
        <div class="footer-left1">
          <marquee behavior="scrool" direction="left">
            Cont: +81 090-6858-7172
          </marquee>
        </div>
        <div class="footer-right">&copy; 2025 The RJ Edit.</div>
        <div class="clear"></div>
      </div>
    </div>
  </body>
</html>
